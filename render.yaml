# Render Blueprint — free test deployment of the whole Zeviro app (website + client portal + admin + API + live chat)
# on ONE free web service:  https://<name>.onrender.com
#   website + client portal   https://<name>.onrender.com
#   super admin               https://<name>.onrender.com/login?portal=admin
#   team                      https://<name>.onrender.com/login?portal=team
# Database: a free MongoDB Atlas cluster (paste its connection string into MONGO_URI when Render asks).
services:
  - type: web
    name: zeviro
    runtime: node
    plan: free
    region: singapore      # closest Render region to Bangladesh — pick the same region (Singapore) for MongoDB Atlas
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGO_URI
        sync: false            # Render asks you for this (MongoDB Atlas connection string)
      - key: SEED_ADMIN_PASSWORD
        sync: false            # the super admin password created on first start
      - key: SEED_ADMIN_EMAIL
        value: admin@zeviro.agency
      - key: SEED_ADMIN_NAME
        value: Md Ibrahim Hossain
      - key: JWT_SECRET
        generateValue: true    # long random secret, generated by Render
      - key: UPLOADS_IN_DB
        value: "true"          # free disk is wiped on every restart → keep uploads in MongoDB
      - key: JWT_EXPIRES_IN
        value: 7d
