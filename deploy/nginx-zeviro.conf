# /etc/nginx/sites-available/zeviro  →  ln -s /etc/nginx/sites-available/zeviro /etc/nginx/sites-enabled/
# One Node app serves all four hosts. Get HTTPS with:
#   sudo certbot --nginx -d zeviro.agency -d www.zeviro.agency -d team.zeviro.agency -d admin.zeviro.agency

# www → main domain
server {
    listen 80;
    server_name www.zeviro.agency;
    return 301 https://zeviro.agency$request_uri;
}

server {
    listen 80;
    server_name zeviro.agency team.zeviro.agency admin.zeviro.agency;

    client_max_body_size 20m;   # file uploads (MAX_UPLOAD_MB + margin)

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;                 # the app needs the real host to tell team./admin. apart
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSockets (live chat, real-time messages, typing indicators)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
